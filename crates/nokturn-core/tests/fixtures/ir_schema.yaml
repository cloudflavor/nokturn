openapi: 3.0.0
info:
  title: Schema API
  version: "1.0"
paths:
  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        tags:
          type: array
          items:
            type: string
      required: [id]
    NewItem:
      type: object
      properties:
        name:
          type: string
        tags:
          type: array
          items:
            type: string
