openapi: 3.0.0
info:
  title: Simple API
  version: "1.0"
paths:
  /items:
    get:
      operationId: listItems
      summary: List items
      description: Returns a list of items
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
